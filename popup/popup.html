<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Gyazo Extension Tycoon</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Gyazo Extension Tycoon</h1>

    <section>
      <h2>PNG</h2>
      <button id="btn-rect">矩形選択で保存</button>
      <button id="btn-element">要素選択で保存</button>
      <button id="btn-visible">表示中のページを保存</button>
      <button id="btn-fullpage">ページ全体を保存</button>
    </section>

    <section>
      <h2>GIF(パラパラ漫画)</h2>
      <button id="btn-record-rect">矩形選択で録画開始</button>
      <button id="btn-record-element">要素選択で録画開始</button>
      <button id="btn-record-visible">表示中のページを録画開始</button>
      <button id="btn-record-stop" disabled>録画停止してGIF保存</button>
      <p id="record-status" class="hint"></p>
    </section>

    <p id="message" class="hint"></p>

    <script src="popup.js"></script>
  </body>
</html>
